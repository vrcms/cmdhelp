name: publish
on:
  push:
    tags: ["v*"]
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking cmdhelp@$VERSION on npm..."
          if npm view "cmdhelp@$VERSION" version --json 2>/dev/null | grep -q "$VERSION"; then
            echo "already_published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published, skipping publish."
          else
            echo "already_published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not yet published, will publish."
          fi
      - name: OIDC publish (provenance)
        id: oidc
        if: steps.check.outputs.already_published == 'false'
        continue-on-error: true
        run: npm publish --access public --provenance
      - name: Token fallback publish
        if: ${{ steps.check.outputs.already_published == 'false' && steps.oidc.outcome == 'failure' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public